.handlers=java.util.logging.ConsoleHandler
.level=INFO

# Console handler level - allow FINE through
java.util.logging.ConsoleHandler.level=FINE
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tF %1$tT.%1$tL [%4$s] %3$s - %5$s%6$s%n

# Enable FINE logging for bypass routing code path
com.google.cloud.spanner.spi.v1.KeyAwareChannel.level=FINE
com.google.cloud.spanner.spi.v1.ChannelFinder.level=FINE
com.google.cloud.spanner.spi.v1.KeyRangeCache.level=FINE
com.google.cloud.spanner.spi.v1.KeyRecipeCache.level=FINE
com.google.cloud.spanner.spi.v1.GrpcChannelEndpointCache.level=FINE

io.grpc.ChannelLogger.level=FINEST
com.google.cloud.grpc.GcpManagedChannel.level=FINEST
com.google.cloud.grpc.GcpManagedChannelBuilder.level=FINEST

io.grpc.level=FINEST
io.grpc.netty.level=FINEST
io.grpc.netty.shaded.io.grpc.netty.level=FINEST
com.google.cloud.grpc.level=FINEST
